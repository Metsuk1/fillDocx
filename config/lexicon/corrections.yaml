# Общие исправления распознавания для обоих врачей (§9 правил).
# Ключ — как ошибается распознавание (строчными), значение — правильный текст.
# Пополняется по результатам ручной проверки. Индивидуальные ошибки — в doctor_*.yaml.

phrases:
  "окно кодальный": "кранио-каудальный"
  "окно-кодальный": "кранио-каудальный"
  "кранио кодальный": "кранио-каудальный"
  "крания каудальный": "кранио-каудальный"
  "плотность парихльной печни": "плотность паренхимы печени"
  "желудка трофичная": "поджелудочная железа атрофичная"
  "кардина от жидко": "кардиальный отдел желудка"
  "клетчатка индутирована": "клетчатка инфильтрирована"
  "паронхимы": "паренхимы"
  "парахематозных фазах": "паренхиматозную фазу"
  "сстепороз": "остеопороз"
  "фгд специальной биопсия": "ФГДС с прицельной биопсией"
  "дата рождение": "дата рождения"
  "вне внутрипеченочные": "вне- внутрипеченочные"
  "вневнутрипеченочные": "вне- внутрипеченочные"
  "единиц хаусфилда": "ед.Н"
# «пангартроз» → «спондилоартроз» сознательно НЕ добавлен: по правилам нужна проверка
# контекста и аудио. Такие случаи решает LLM с пометкой на проверку.

# Минимальный порог для нечёткого исправления отдельных слов (0..100).
fuzzy_min_score: 88
