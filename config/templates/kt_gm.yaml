# Карта шаблона «КТ головного мозга» (врач У.Р.).
# ЧЕРНОВИК: формулировки взяты из правил 1–7. Сверьте с исходным шаблоном.

id: kt_gm
title: "КТ ГМ"
match:
  filename: ['кт\s*-?\s*гм\b', 'головного\s+мозга']
  heading: ['головного\s+мозга']
fields:
  birth_date: "Дата рождения:"
  contrast: "Контрастное вещество:"
content_start: "Информированное добровольное согласие"
style:
  ventricle_dash: true   # «III – желудочек» (правило 7)

organs:
  - id: subarachnoid
    name: "субарахноидальные пространства, борозды, цистерны"
    anchor: "Субарахноидальные пространства"
    notes: >-
      Правило 1: «умеренно всё расширены» → «Субарахноидальные пространства умеренно расширены,
      конвекситальные борозды углублены. Сильвиевы и базальные цистерны умеренно расширены.»
      Правило 2: «всё расширены» → то же без «умеренно». «всё» здесь — часть команды, не конец диктовки.
    clause_rules:
      - {match: 'субарахноидальные пространства умеренно вс[её] расширены', out: 'Субарахноидальные пространства умеренно расширены, конвекситальные борозды углублены. Сильвиевы и базальные цистерны умеренно расширены.', rule: 1}
      - {match: 'субарахноидальные пространства вс[её] расширены', out: 'Субарахноидальные пространства расширены, конвекситальные борозды углублены. Сильвиевы и базальные цистерны расширены.', rule: 2}

  - id: ventricles
    name: "желудочки"
    anchor: "Боковые желудочки"
    notes: >-
      Правило 7: исходный блок (с альтернативами) не удалять; под ним новым красным абзацем —
      продиктованный текст, III и IV римскими цифрами с тире. Старые размеры не переносить.

  - id: vessels
    name: "сосуды"
    anchor: "Супраклиноидные отделы"
    norm: "Супраклиноидные отделы обеих внутренних сонных артерий и интракраниальные отделы обеих позвоночных артерий с пристеночными кальцинатами."
    notes: "Правило 3: «супраклиноидные фразу оставляем» = сохранить стандартную фразу."

  - id: bone_window
    name: "костное окно"
    anchor: "В костном окне"
    norm: "В костном окне костно-деструктивных изменений не определяется."
    notes: >-
      Правило 4: «в костном окне норма» = стандартная фраза. Правила 5–6: артроз атланто-аксиального
      сочленения — предложение после нормы; «невыраженными» — только при «начальных проявлениях».
    clause_rules:
      - {match: 'артроз атланто-аксиального( сочленения)? в начальных проявлениях', out: 'Выявлен артроз атланто-аксиального сочленения, с невыраженными краевыми костными разрастаниями суставных поверхностей зубовидного отростка тела С2 позвонка и передней дуги атланта.', rule: 5}
      - {match: 'артроз атланто-аксиального( сочленения)?', out: 'Выявлен артроз атланто-аксиального сочленения, с краевыми костными разрастаниями суставных поверхностей зубовидного отростка тела С2 позвонка и передней дуги атланта.', rule: 6}

conclusion:
  anchor: "Заключение:"
  label: "Заключение:"
  hints: []

recommendations:
  default_label: "Рекомендовано:"
