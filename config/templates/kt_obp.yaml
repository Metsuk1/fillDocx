# Карта шаблона «КТ абдоминального сегмента» (КТ ОБП и КТ АС — одна категория).
#
# Нормальные формулировки взяты из правил 17–38 и эталонных протоколов.
# ВАЖНО: перед работой сверьте anchor/norm с исходными шаблонами каждого врача.
# Якорь (anchor) — начало предложения в шаблоне, по нему находится место правки.
#
# Порядок органов = порядок в протоколе. Продиктованное раскладывается по этому
# порядку независимо от того, когда врач это сказал (правила 21, 31).

id: kt_obp
title: "КТ ОБП / КТ АС"
match:
  filename: ['кт\s*-?\s*(обп|ас)\b', '\b(обп|ас)\s*\+']
  heading: ['абдоминального\s+сегмента', 'органов\s+брюшной\s+полости']
fields:
  birth_date: "Дата рождения:"
  contrast: "Контрастное вещество:"
content_start: "Информированное добровольное согласие"

organs:
  - id: liver
    name: "печень"
    anchor: "На полученных КТ изображениях печень"
    norm: >-
      На полученных КТ изображениях печень обычной формы, не увеличена в размерах,
      кранио-каудальный размер правой доли печени составляет мм, плотность паренхимы ед.Н,
      при нативном сканировании структура паренхимы однородная.
    slots:
      cc_size: {kind: size, about: "кранио-каудальный размер правой доли печени", before: "составляет", after: "мм", rules: [17, 23]}
      density: {kind: density, about: "плотность паренхимы печени (одно или два значения)", before: "плотность паренхимы", after: "ед.Н", rules: [17, 18, 19, 25]}
    notes: >-
      Правило 17: «обычной формы и размеров» + числа = норма, заполняются только слоты.
      Правило 26: «структура неоднородная, в V сегменте определяется …» — изменение:
      после «неоднородная» запятая и описание образования, сегменты римскими цифрами.

  - id: gallbladder
    name: "желчный пузырь"
    anchor: "Желчный пузырь"
    norm: >-
      Желчный пузырь овально-вытянутой формы, стенки не утолщены, в шейке и в теле определяется перегиб.
      В просвете рентген контрастных конкрементов не выявлено.
    notes: >-
      Правило 27: порядок — форма → стенки → перегиб → содержимое просвета. Перегиб только если
      продиктован. «в структуре желчного пузыря выявлены конкременты» → «в просвете пузыря выявлены
      конкременты». При конкрементах не оставлять фразу «конкрементов не выявлено».
      Правило 28: «не визуализируется (холецистэктомия)»; клипсы — только если продиктованы.
    rewrites:
      - {pattern: 'в структуре желчного пузыря', replace: 'в просвете пузыря', rule: 27}

  - id: ducts
    name: "вне- и внутрипеченочные протоки, холедох"
    anchor: "Вне- внутрипеченочные протоки"
    norm: "Вне- внутрипеченочные протоки не расширены."
    slots:
      choledoch: {kind: size, about: "ширина холедоха", rules: [20, 23]}
    formed:
      - "Вне- внутрипеченочные протоки не расширены, холедох шириной {choledoch}."
    notes: "Правило 20: холедох — только если продиктован."

  - id: veins
    name: "воротная и селезеночная вены"
    anchor: "Воротная"
    norm: "Воротная, селезеночная вены не расширены."
    slots:
      portal: {kind: size, about: "ширина воротной вены", rules: [21, 23]}
      splenic: {kind: size, about: "ширина селезеночной вены", rules: [21, 23]}
    formed:
      - "Воротная вена шириной {portal}, селезеночная вена {splenic}."
      - "Воротная вена шириной {portal}."
      - "Селезеночная вена шириной {splenic}."
    notes: >-
      Правило 21: строго после протоков и холедоха, до поджелудочной железы. Не переносить
      селезеночную вену в абзац селезенки. Правило 22/29: «не расширена» = норма.

  - id: pancreas
    name: "поджелудочная железа"
    anchor: "Поджелудочная железа"
    norm: "Поджелудочная железа обычной формы, не увеличена в размерах, контуры четкие, ровные, структура однородная."
    notes: >-
      Правило 30: «норма, контуры сглажены» → норма шаблона, меняются только контуры.
      Правило 50: «поджелудка атрофичная, уменьшена в размерах, структура однородная» →
      «Поджелудочная железа атрофичная, уменьшена в размерах, контуры четкие, ровные, структура однородная.»
    rewrites:
      - {pattern: '\bподжелудка\b', replace: 'поджелудочная железа', rule: 50}

  - id: duodenum
    name: "двенадцатиперстная кишка"
    virtual: true
    place_after: pancreas
    own_paragraph: true
    notes: "Правило 31: отдельным абзацем строго между поджелудочной железой и селезенкой."

  - id: spleen
    name: "селезенка"
    anchor: "Селезенка"
    norm: "Селезенка обычной формы и размеров, контуры ровные, денситометрические показатели в пределах ед.Н."
    slots:
      density: {kind: density, about: "плотность селезенки (одно или два значения)", before: "в пределах", after: "ед.Н", rules: [18, 19, 25]}
    notes: "Правило 19: «плотность печени 50, селезенки 20» — второе значение сюда, слово «плотность» не повторяется."

  - id: stomach
    name: "желудок"
    virtual: true
    place_after: spleen
    own_paragraph: true
    notes: "Правило 31: отдельным абзацем строго между селезенкой и надпочечниками."

  - id: adrenals
    name: "надпочечники"
    anchor: "Надпочечники"
    norm: "Надпочечники Y-образной формы, обычных размеров, ножки не утолщены."

  - id: kidneys
    name: "почки"
    anchor: "Почки"
    alt_anchors: ["Правая почка", "Левая почка"]
    norm: >-
      Почки «бобовидной» формы, обычных размеров, сосудистые ножки не изменены. Контуры почек ровные, четкие.
      Синусы почек не расширены, паранефральная клетчатка не изменена. При нативном сканировании структура
      паренхимы почек однородная, в проекции лоханок, чашечек и мочеточников конкрементов не выявлено.
    notes: >-
      Правило 32: отсутствующая почка — «Правая почка в типичном месте не визуализируется.», для неё нет
      описания нормы; вторая описывается отдельно. Не путать нефрэктомию и спленэктомию, операцию не
      называть, если врач не назвал. Правило 33: образование почки — после предложения о паранефральной
      клетчатке и до предложения о нативном сканировании; сторона, сегмент, контуры, размеры, плотность —
      из диктовки.

  - id: lymph_nodes
    name: "лимфоузлы"
    virtual: true
    place_after: kidneys
    own_paragraph: true

  - id: aorta
    name: "брюшной отдел аорты"
    virtual: true
    place_after: kidneys
    own_paragraph: true

  - id: pelvis
    name: "малый таз, мочевой пузырь, предстательная железа / матка"
    anchor: "В малом тазу"
    alt_anchors: ["Мочевой пузырь"]
    norm: "В малом тазу мочевой пузырь среднего наполнения, стенки не утолщены, содержимое однородное."

  - id: angio
    name: "КТ-ангиография"
    anchor: "При КТ-ангиографии"
    contrast_only: true

  - id: contrast
    name: "контрастное усиление"
    anchor: "После внутривенного контрастного усиления"
    contrast_only: true
    norm: >-
      После внутривенного контрастного усиления патологического накопления контрастного вещества
      в структурах паренхиматозных органов брюшной полости и забрюшинного пространства не выявлено.

  - id: excretory
    name: "паренхиматозная / экскреторная фаза, КТ-урография"
    anchor: "В паренхиматозную фазу"
    alt_anchors: ["При КТ урографии", "При КТ-урографии"]
    contrast_only: true

  - id: free_fluid
    name: "свободная жидкость"
    anchor: "Признаков наличия свободной жидкости"
    norm: "Признаков наличия свободной жидкости в брюшной полости и в полости малого таза не выявлено."

  - id: bone_window
    name: "костное окно, позвоночник"
    anchor: "В костном окне"
    norm: "В костном окне данных за деструктивные и травматические повреждения не выявлено."
    notes: >-
      Правило 34: изменения по передним и боковым контурам тел нижне-грудных и поясничных позвонков →
      «В костном окне по передним и боковым контурам тел нижне-грудных и поясничных позвонков
      определяются краевые костные разрастания.» Правила 47–49: лордоз, краевые разрастания, артроз
      дугоотростчатых суставов — каждое отдельным предложением в указанном порядке.
    clause_rules:
      # Срабатывают на коротко продиктованную часть (целиком), длинную форму не трогают.
      - {match: '(в костном окне\s+)?поясничный лордоз (выражен|сглажен|выпрямлен|усилен|сохранен)', out: 'В костном окне поясничный лордоз {2}.', rule: 47}
      - {match: '(в костном окне\s+)?краевые костные разрастания', out: 'По передним и боковым контурам тел поясничных позвонков определяются краевые костные разрастания.', rule: 48}
      - {match: '(в костном окне\s+)?артроз дугоотростчатых суставов', out: 'На исследуемых уровнях суставные щели дугоотростчатых суставов сужены, сочленяющиеся поверхности склерозированы с краевыми костными разрастаниями.', rule: 49}
      - {match: 'структура тел поясничных позвонков порот\w+( изменена)?', out: 'Структура тел поясничных позвонков поротически изменена.', rule: 37}

conclusion:
  anchor: "Заключение:"
  label: "Заключение:"
  # Подсказки соответствия «описание → заключение» (правила 35–38).
  # Показываются ТОЛЬКО в интерфейсе проверки, в Word сами не вставляются.
  hints:
    - {when: 'структура тел поясничных позвонков порот', suggest: 'Диффузный остеопороз тел поясничных позвонков.', rule: 37}
    - {when: 'структура тел нижне-грудных и поясничных позвонков порот', suggest: 'Диффузный остеопороз тел нижне-грудных и поясничных позвонков.', rule: 37}
    - {when: 'смещение тела (\w+) позвонка кпереди', suggest: 'Антелистез тела {1} позвонка.', rule: 38}
    - {when: 'суставные щели дугоотростчатых суставов сужены', suggest: 'Спондилоартроз.', rule: 49}
    - {when: 'кистозное образование (\w+) сегмента печени', suggest: 'Киста {1} сегмента печени.', rule: 35}

recommendations:
  default_label: "Рекомендовано:"
