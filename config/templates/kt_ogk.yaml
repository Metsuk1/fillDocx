# Карта шаблона «КТ грудного сегмента» (КТ ОГК и КТ ГС — одна категория).
# ЧЕРНОВИК: формулировки взяты из правил 39–44. Сверьте с исходными шаблонами врачей.

id: kt_ogk
title: "КТ ОГК / КТ ГС"
match:
  filename: ['кт\s*-?\s*(огк|гс)\b', '\b(огк|гс)\s*\+']
  heading: ['грудного\s+сегмента', 'органов\s+грудной\s+клетки']
fields:
  birth_date: "Дата рождения:"
  contrast: "Контрастное вещество:"
content_start: "Информированное добровольное согласие"

organs:
  - id: lungs
    name: "легочная ткань"
    anchor: "На полученных КТ изображениях"
    norm: "На полученных КТ изображениях свежих очаговых и инфильтративных изменений в структуре легочной ткани не выявлено."
    notes: "Правило 39: «свежих очаговых изменений в легких не выявлено» = норма, полная стандартная фраза."

  - id: bronchi
    name: "трахея, бронхи, лимфоузлы средостения, плевра"
    anchor: "Просвет трахеи"
    norm: >-
      Просвет трахеи, главных и долевых бронхов прослеживается до сегментарного уровня, стенки бронхов
      не утолщены. Внутригрудные лимфоузлы не увеличены. Жидкости в плевральных полостях не выявлено.
    notes: "Правило 40: одна характеристика бронхов не подтверждает остальные независимые нормы."

  - id: heart
    name: "сердце, перикард, аорта, легочный ствол"
    anchor: "Сердце, перикард"
    norm: "Сердце, перикард, аорта, легочный ствол дифференцированы. Ширина легочного ствола и его ветвей в пределах нормы."
    slots:
      trunk: {kind: size, about: "ширина легочного ствола", rules: [41, 23]}
      right_branch: {kind: size, about: "правая ветвь легочной артерии", rules: [41]}
      left_branch: {kind: size, about: "левая ветвь легочной артерии", rules: [41]}
    formed:
      - "Сердце, перикард, аорта, легочный ствол дифференцированы. Ширина легочного ствола {trunk}, правая ветвь {right_branch}, левая ветвь {left_branch}."
      - "Сердце, перикард, аорта, легочный ствол дифференцированы. Ширина легочного ствола {trunk}."
    notes: "Правило 41: не оставлять одновременно фразу о норме и новые размеры."

  - id: thoracic_aorta
    name: "стенки грудного отдела аорты"
    virtual: true
    place_after: heart
    own_paragraph: true
    notes: "Правило 42: «Стенки грудного отдела аорты и ее ветвей уплотнены, с пристеночными кальцинатами.» — после сердца."

  - id: visible_slices
    name: "видимые срезы (брюшной сегмент, мягкие ткани шеи)"
    virtual: true
    place_after: thoracic_aorta
    own_paragraph: true
    italic_prefixes: ["В видимых срезах брюшного сегмента", "В видимых срезах мягких тканей шеи"]
    notes: "Правила 43–44: отдельными абзацами; вводная часть курсивом, дальше обычным шрифтом."
    rewrites:
      - {pattern: '\bв видимых сканах\b', replace: 'в видимых срезах', rule: 43}

  - id: contrast
    name: "контрастное усиление"
    anchor: "После внутривенного контрастного усиления"
    contrast_only: true

  - id: bone_window
    name: "костное окно"
    anchor: "В костном окне"
    norm: "В костном окне данных за деструктивные и травматические повреждения не выявлено."

conclusion:
  anchor: "Заключение:"
  label: "Заключение:"
  hints: []

recommendations:
  default_label: "Рекомендовано:"
