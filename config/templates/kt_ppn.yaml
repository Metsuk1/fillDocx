# Карта шаблона «КТ придаточных пазух носа».
# ЧЕРНОВИК: формулировки взяты из правил 10–14. Сверьте с исходными шаблонами врачей.

id: kt_ppn
title: "КТ ППН"
match:
  filename: ['кт\s*-?\s*ппн\b', 'пазух']
  heading: ['придаточных\s+пазух\s+носа']
fields:
  birth_date: "Дата рождения:"
  contrast: "Контрастное вещество:"
content_start: "Информированное добровольное согласие"

organs:
  - id: nasal
    name: "носовые раковины и носовая перегородка"
    anchor: "На полученных КТ изображениях"
    notes: >-
      Правило 10: «с обеих сторон» у раковин не пишется. Правило 11: «не искривлена» →
      «расположена по срединной линии»; «искривлена вправо/влево», «незначительно искривлена» — как
      продиктовано. Не путать «не искривлена» и «незначительно искривлена».
    rewrites:
      - {pattern: '(раковины)\s+с обеих сторон', replace: '\1', rule: 10}
      - {pattern: 'носовая перегородка не искривлена', replace: 'носовая перегородка расположена по срединной линии', rule: 11}

  - id: sinuses
    name: "околоносовые пазухи"
    anchor: "Пневматизация придаточных пазух носа"
    norm: "Пневматизация придаточных пазух носа сохранена."
    notes: >-
      Правило 12: описание пазух — отдельным абзацем сразу после раковин и перегородки.
      Правило 13: «пазухи норма» = стандартная фраза; поздние изменения — отдельным абзацем под ней,
      строго до фразы о височных костях. Противоречие нормы и уточнения — на проверку.

  - id: temporal
    name: "пирамиды височных костей, сосцевидные отростки"
    anchor: "Пневматизация ячеек пирамид височных костей"
    norm: "Пневматизация ячеек пирамид височных костей и сосцевидных отростков с обеих сторон сохранена."
    notes: "Правило 14: обе формулировки врача = полная стандартная фраза, без дублей."

  - id: bone_window
    name: "костное окно"
    anchor: "В костном окне"

conclusion:
  anchor: "Заключение:"
  label: "Заключение:"
  hints: []

recommendations:
  default_label: "Рекомендовано:"
