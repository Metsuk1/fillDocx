[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filldocx"
version = "0.1.0"
description = "Офлайн-заполнение Word-протоколов КТ/МРТ по аудиодиктовке врача"
requires-python = ">=3.11,<3.14"
dependencies = [
    "python-docx>=1.1",
    "lxml>=5",
    "pydantic>=2.6",
    "pyyaml>=6",
    "rapidfuzz>=3.6",
    "requests>=2.31",
]

[project.optional-dependencies]
# Распознавание речи и VAD. torch ставится отдельно под вашу версию CUDA (см. README).
asr = [
    "silero-vad>=5.1",
    "soundfile>=0.12",
    "numpy>=1.26",
]
ui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
filldocx = "filldocx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filldocx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
